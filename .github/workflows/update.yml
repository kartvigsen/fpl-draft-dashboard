name: Update dashboard

on:
  schedule:
    # Runs roughly every 1.5-3 hours. We used to also gate each firing on
    # the current Danish local time (only continuing at 07:00/12:00/16:00/
    # 20:00/23:00) to cut this down to ~5 real runs/day, but GitHub's
    # schedule delivery can run hours late, so that exact-hour check was
    # silently skipping every single run for days. The git-diff check in
    # "Save new data to the repository" already makes a no-op run a no-op
    # commit, so there's no need for the extra gate.
    - cron: "0 5,6,10,11,14,15,18,19,21,22 * * *"
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "*.py"
      - "config.json"
      - ".github/workflows/update.yml"
  workflow_dispatch:      # adds the manual "Run workflow" button

permissions:
  contents: write         # save downloaded data back to the repository
  pages: write            # publish the site
  id-token: write         # required by the Pages deploy step

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download data and rebuild the dashboard
        run: python3 update.py

      - name: Save new data to the repository
        run: |
          git config user.name "fpl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send the weekly digest, if a new gameweek just finished
        continue-on-error: true   # a digest/email hiccup must never block the dashboard update or deploy above
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: |
          python3 send_digest.py
          if [ -f .digest_state.json ]; then
            git add .digest_state.json
            if ! git diff --cached --quiet -- .digest_state.json; then
              git commit -m "Record digest sent for this gameweek"
              git push
            fi
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # A separate job so the github-pages environment's branch protection
  # (publish from main only) gates just this deploy step, not the whole
  # job above -- the data rebuild and digest send can still be run and
  # tested (e.g. via "Run workflow") from any branch.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
