name: Update dashboard

on:
  schedule:
    # Every 10 minutes; should_update.py lets a run do the real work only
    # while a match is on or just finished (any day of the week), when the
    # data is over 3 hours old, or when code changed since the last build.
    # No fixed clock times: GitHub's schedule can run hours late, which
    # once made an exact-hour check skip every run for days. In practice
    # GitHub fires this only every few hours, so an external scheduler can
    # start the same check on time via "Run workflow" with check=true (see
    # README); this timer stays as a fallback.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "*.py"
      - "config.json"
      - ".github/workflows/update.yml"
  workflow_dispatch:      # the manual "Run workflow" button, and the external scheduler (see README)
    inputs:
      check:
        description: "Only update if a match is on or the data is stale (set by the external scheduler)"
        type: boolean
        default: false

permissions:
  contents: write         # save downloaded data back to the repository
  pages: write            # publish the site
  id-token: write         # required by the Pages deploy step

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to update
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.check }}" = "true" ]; then
            python3 should_update.py >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Download data and rebuild the dashboard
        if: steps.gate.outputs.run == 'true'
        run: python3 update.py

      - name: Save new data to the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "fpl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            # GitHub occasionally answers a push with a 500; retry before failing the run.
            for attempt in 1 2 3; do
              git push && break
              if [ "$attempt" = 3 ]; then echo "Push failed 3 times, giving up."; exit 1; fi
              echo "Push failed (attempt $attempt), retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
              git pull --rebase
            done
          fi

      - name: Send the weekly digest, if a new gameweek just finished
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true   # a digest/email hiccup must never block the dashboard update or deploy above
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: |
          python3 send_digest.py
          if [ -f .digest_state.json ]; then
            git add .digest_state.json
            if ! git diff --cached --quiet -- .digest_state.json; then
              git commit -m "Record digest sent for this gameweek"
              git push
            fi
          fi

      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: docs

  # A separate job so the github-pages environment's branch protection
  # (publish from main only) gates just this deploy step, not the whole
  # job above -- the data rebuild and digest send can still be run and
  # tested (e.g. via "Run workflow") from any branch.
  deploy:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
