name: Update dashboard

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (07:00 in Denmark in summer)
  workflow_dispatch:      # adds the manual "Run workflow" button

permissions:
  contents: write         # save downloaded data back to the repository
  pages: write            # publish the site
  id-token: write         # required by the Pages deploy step

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download data and rebuild the dashboard
        run: python3 update.py

      - name: Save new data to the repository
        run: |
          git config user.name "fpl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
