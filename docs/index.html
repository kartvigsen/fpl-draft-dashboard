<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Draft Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --wash: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --good: #006300; --bad: #d03b3b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --h0: #cde2fb; --h1: #9ec5f4; --h2: #6da7ec; --h3: #2a78d6; --h4: #184f95;
  --h-ink-light: #0b0b0b; --h-ink-dark: #ffffff;
  --rs-lo: #e2a39d; --rs-hi: #9cc9a6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --wash: #222221;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --good: #0ca30c; --bad: #ec6a6a;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --rs-lo: #96524c; --rs-hi: #4f8a5c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --wash: #222221;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --good: #0ca30c; --bad: #ec6a6a;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --rs-lo: #96524c; --rs-hi: #4f8a5c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 17px; margin: 40px 0 12px; font-weight: 650; }
h3 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0; }
button.ghost {
  background: transparent; color: var(--ink-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
button.ghost:hover { background: var(--wash); }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.banner { margin: 16px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--wash); font-size: 13px; color: var(--ink-2); }
.banner strong { color: var(--ink); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 20px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.tile { padding: 14px 16px; min-width: 0; }
.tile .label { color: var(--ink-2); font-size: 12.5px; margin: 0 0 6px; }
.tile .value { font-size: 26px; font-weight: 650; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.tile .value.small { font-size: 18px; }
.tile .note { color: var(--ink-2); font-size: 12.5px; margin: 6px 0 0; overflow-wrap: anywhere; }
.card { padding: 16px; margin-bottom: 12px; min-width: 0; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid-2col { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
.chart { position: relative; margin-top: 8px; min-height: 120px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart:focus-visible { outline-offset: 4px; border-radius: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 140px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 8px 10px; font-size: 12.5px; color: var(--ink-2);
}
.tip .t { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.tip .r b { color: var(--ink); font-weight: 650; min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.tip .r span.nm { overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
th[role="button"] { cursor: pointer; user-select: none; }
th[role="button"]:hover { color: var(--ink); }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }
.who { display: inline-flex; align-items: center; gap: 8px; }
.who small { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
.rk { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.win { font-weight: 650; }
.mark { font-size: 10px; color: var(--ink-2); margin-right: 3px; }
tr.live td { color: var(--ink-2); font-style: italic; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
details .tbl-wrap { margin-top: 8px; }
.bars { display: grid; gap: 12px; margin-top: 10px; }
.brow { display: grid; grid-template-columns: minmax(84px, 150px) 1fr; gap: 12px; align-items: center; }
.brow .nm { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.brow .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btrack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar { height: 20px; border-radius: 0 4px 4px 0; min-width: 2px; transition: filter .12s; }
.brow:hover .bar, .brow:focus-visible .bar { filter: brightness(1.12); }
.bval { font-weight: 650; font-variant-numeric: tabular-nums; }
.bnote { grid-column: 2; color: var(--ink-2); font-size: 12px; margin-top: -6px; }
.heat td, .heat th { padding: 4px; text-align: center; }
.heat td.l, .heat th.l { text-align: left; padding-left: 0; }
.heat .cell { min-width: 26px; height: 28px; line-height: 28px; border-radius: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.plist { list-style: none; margin: 8px 0 0; padding: 0; }
.plist li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
.plist li:last-child { border-bottom: 0; }
.plist .meta { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
.pos { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
.up { color: var(--good); font-weight: 650; }
.down { color: var(--bad); font-weight: 650; }
.tag-free {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650;
  background: color-mix(in oklab, var(--good) 18%, var(--surface)); color: var(--good);
}
.foot { margin-top: 40px; color: var(--ink-2); font-size: 12.5px; }
.foot p { margin: 4px 0; }
.empty { color: var(--ink-2); font-size: 13.5px; padding: 8px 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters select, .filters input {
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; min-width: 0;
}
textarea {
  display: block; width: 100%; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  font: inherit; font-size: 13.5px; resize: vertical;
}
.hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
[hidden] { display: none !important; }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 18px;
  position: sticky; top: 0; z-index: 10; background: var(--page); border-bottom: 1px solid var(--grid);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  color: var(--ink-2); font: inherit; font-weight: 600; padding: 10px 14px; cursor: pointer; border-radius: 8px 8px 0 0;
}
.tab:hover { color: var(--ink); background: var(--wash); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.panel { min-width: 0; }
.panel:focus-visible { outline-offset: 6px; border-radius: 8px; }
.panel > h2:first-child { margin-top: 24px; }
a.tile { display: block; color: inherit; text-decoration: none; }
a.tile:hover { background: var(--wash); }
@media (max-width: 560px) {
  .grid2, .grid-2col { grid-template-columns: 1fr; }
  h1 { font-size: 21px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><div class="wrap">This dashboard needs JavaScript.</div></noscript>
<script src="data.js"></script>
<script>
"use strict";
const D = window.FPL_DATA;
const app = document.getElementById("app");

/* ---------- tiny DOM helpers (all text goes in via textContent) ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function mk(ns, tag, props, kids) {
  const el = ns ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of [].concat(kids || [])) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const h = (tag, props, ...kids) => mk(false, tag, props, kids.flat(Infinity));
const sv = (tag, props, ...kids) => mk(true, tag, props, kids.flat(Infinity));
const fmt = n => (n == null ? "–" : Number(n).toLocaleString("en-GB"));
const col = m => `var(--series-${(m.color % 8) + 1})`;
const dot = m => h("span", { class: "dot", style: `background:${col(m)}` });

/* ---------- theme toggle ---------- */
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
try { applyTheme(localStorage.getItem("fpl-theme")); } catch (e) { /* storage unavailable */ }
function toggleTheme() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("fpl-theme", next); } catch (e) { /* ignore */ }
}

if (!D) {
  app.append(h("p", {}, "No data yet. Run "), h("code", {}, "python3 update.py"),
             h("span", {}, " and reload this page."));
  throw new Error("FPL_DATA missing");
}

const M = D.managers;
const byId = Object.fromEntries(M.map(m => [m.entry_id, m]));
const PM = D.per_manager;
const meta = D.meta;
const gws = D.trends.gws;
const finishedRounds = D.rounds.filter(r => gws.includes(r.gw));
const nameOf = m => m.team;

/* ---------- shared tooltip ---------- */
function placeTip(tip, host, x, y) {
  const w = host.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = x + 14; if (left + tw > w) left = x - tw - 14; if (left < 0) left = 0;
  let top = y - th / 2; if (top < 0) top = 0;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function tipRow(m, value, label) {
  return h("div", { class: "r" }, h("span", { class: "key", style: `background:${col(m)}` }),
           h("b", {}, value), h("span", { class: "nm" }, label || nameOf(m)));
}

/* ---------- muted red-to-green score scale ---------- */
// A diverging scale (bad hue <-> neutral wash <-> good hue) rather than a
// four-hue traffic-light ramp: calmer, and it uses the app's own tones so it
// adapts with the theme instead of a fixed set of hex stops.
function roundColor(t) {
  t = Math.max(0, Math.min(1, t));
  if (t < 0.5) {
    const local = (t / 0.5) * 100;
    return `color-mix(in oklab, var(--wash) ${local.toFixed(1)}%, var(--rs-lo) ${(100 - local).toFixed(1)}%)`;
  }
  const local = ((t - 0.5) / 0.5) * 100;
  return `color-mix(in oklab, var(--rs-hi) ${local.toFixed(1)}%, var(--wash) ${(100 - local).toFixed(1)}%)`;
}

/* ---------- axis helpers ---------- */
function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, raw = span / count, pow = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(f => f * pow).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
  return { ticks: t, lo, hi };
}

/* ---------- line chart with crosshair + tooltip ---------- */
const redraws = [];
function lineChart(host, cfg) {
  const render = () => {
    host.textContent = "";
    const W = Math.max(280, host.clientWidth), H = cfg.height || 270;
    const m = { l: 38, r: 14, t: 14, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = cfg.series.flatMap(s => s.values);
    let lo, hi, ticks;
    if (cfg.rank) { lo = 1; hi = cfg.rank; ticks = Array.from({ length: hi }, (_, i) => i + 1); }
    else { const nt = niceTicks(Math.min(...all), Math.max(...all), 5); lo = nt.lo; hi = nt.hi; ticks = nt.ticks; }
    const n = cfg.xs.length;
    const X = i => m.l + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
    const Y = v => cfg.rank ? m.t + ((v - lo) / (hi - lo || 1)) * ih : m.t + ih - ((v - lo) / (hi - lo || 1)) * ih;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.label });
    for (const t of ticks) {
      svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === lo && !cfg.rank ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      svg.append(sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }, cfg.rank ? "#" + t : fmt(t)));
    }
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 34))));
    cfg.xs.forEach((x, i) => {
      if (i % every === 0 || i === n - 1) svg.append(sv("text", { x: X(i), y: H - 8, "text-anchor": "middle", fill: "var(--muted)", "font-size": 11 }, x));
    });
    for (const s of cfg.series) {
      const d = s.values.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
      svg.append(sv("path", { d, fill: "none", stroke: col(s.m), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    // end dots (>= 8px, 2px surface ring)
    for (const s of cfg.series) {
      const i = s.values.length - 1;
      svg.append(sv("circle", { cx: X(i), cy: Y(s.values[i]), r: 4, fill: col(s.m), stroke: "var(--surface)", "stroke-width": 2 }));
    }
    // selective labels for the extremes
    for (const lab of cfg.labels || []) {
      const s = cfg.series[lab.si], v = s.values[lab.i];
      svg.append(sv("circle", { cx: X(lab.i), cy: Y(v), r: 4, fill: col(s.m), stroke: "var(--surface)", "stroke-width": 2 }));
      svg.append(sv("text", { x: X(lab.i), y: Y(v) + (lab.below ? 17 : -9), "text-anchor": "middle", "font-size": 12, "font-weight": 650,
        fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 3, "paint-order": "stroke" }, fmt(v)));
    }
    const cross = sv("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 });
    const hoverDots = cfg.series.map(s => sv("circle", { r: 4, fill: col(s.m), stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }));
    svg.append(cross, ...hoverDots);
    const overlay = sv("rect", { x: m.l, y: 0, width: iw, height: H, fill: "transparent" });
    svg.append(overlay);
    const tip = h("div", { class: "tip", style: "display:none", role: "status" });
    host.append(svg, tip);

    let idx = null;
    const show = (i, py) => {
      idx = i;
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
      cfg.series.forEach((s, k) => { hoverDots[k].setAttribute("cx", X(i)); hoverDots[k].setAttribute("cy", Y(s.values[i])); hoverDots[k].setAttribute("opacity", 1); });
      tip.textContent = "";
      tip.append(h("div", { class: "t" }, (cfg.xTitle || "Gameweek ") + cfg.xs[i]));
      const rows = cfg.series.map(s => ({ s, v: s.values[i] })).sort((a, b) => cfg.rank ? a.v - b.v : b.v - a.v);
      for (const r of rows) tip.append(tipRow(r.s.m, cfg.rank ? "#" + r.v : fmt(r.v)));
      tip.style.display = "block";
      placeTip(tip, host, X(i), py == null ? ih / 2 : py);
    };
    const hide = () => {
      idx = null; tip.style.display = "none"; cross.setAttribute("opacity", 0); hoverDots.forEach(d => d.setAttribute("opacity", 0));
    };
    const nearest = ev => {
      const r = svg.getBoundingClientRect(), x = ((ev.clientX - r.left) / r.width) * W;
      return Math.min(n - 1, Math.max(0, Math.round(((x - m.l) / (iw || 1)) * (n - 1))));
    };
    overlay.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(); show(nearest(ev), ((ev.clientY - r.top) / r.height) * H); });
    overlay.addEventListener("pointerleave", hide);
    host.tabIndex = 0;
    host.onkeydown = ev => {
      if (ev.key === "ArrowRight") { show(Math.min(n - 1, (idx == null ? -1 : idx) + 1)); ev.preventDefault(); }
      else if (ev.key === "ArrowLeft") { show(Math.max(0, (idx == null ? n : idx) - 1)); ev.preventDefault(); }
      else if (ev.key === "Escape") hide();
    };
    host.onblur = hide;
  };
  render();
  let last = host.clientWidth;
  new ResizeObserver(() => { if (Math.abs(host.clientWidth - last) > 1) { last = host.clientWidth; requestAnimationFrame(render); } }).observe(host);
}

/* ---------- reusable bits ---------- */
function legend(list) {
  return h("ul", { class: "legend" }, list.map(m => h("li", {}, h("span", { class: "key", style: `background:${col(m)}` }), nameOf(m))));
}
function tableView(headers, rows) {
  return h("details", {}, h("summary", {}, "View as table"),
    h("div", { class: "tbl-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, headers.map((x, i) => h("th", { class: i ? "" : "l" }, x)))),
      h("tbody", {}, rows.map(r => h("tr", {}, r.map((c, i) => h("td", { class: i ? "num" : "l" }, c))))))));
}
function card(title, sub, ...kids) {
  return h("div", { class: "card" }, h("h3", {}, title), sub ? h("p", { class: "sub" }, sub) : null, ...kids);
}
function section(title) { return h("h2", {}, title); }
function emptyMsg(t) { return h("p", { class: "empty" }, t); }

function makeSortHeader(cols, initialKey, initialDir) {
  let sortKey = initialKey, sortDir = initialDir;
  function sortBy(key, onChange) {
    const col = cols.find(c => c.key === key);
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = col.num ? -1 : 1; }
    onChange();
  }
  return {
    sorted(list) {
      const col = cols.find(c => c.key === sortKey);
      return [...list].sort((a, b) => {
        const av = col.get(a), bv = col.get(b);
        return (col.num ? av - bv : String(av).localeCompare(String(bv))) * sortDir;
      });
    },
    row(onChange) {
      const tr = h("tr", {});
      for (const c of cols) {
        const active = c.key === sortKey;
        tr.append(h("th", { class: c.num ? "" : "l", role: "button", tabindex: "0",
          "aria-sort": active ? (sortDir === 1 ? "ascending" : "descending") : "none",
          onclick: () => sortBy(c.key, onChange),
          onkeydown: ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sortBy(c.key, onChange); } } },
          c.label + (active ? (sortDir === 1 ? " ▲" : " ▼") : "")));
      }
      return tr;
    },
  };
}

function barList(rows, unit) {
  const max = Math.max(1, ...rows.map(r => r.value));
  const wrap = h("div", { class: "bars" });
  for (const r of rows) {

    { key: "club", label: "Club", num: false, get: p => p.club },
    { key: "pos", label: "Position", num: false, get: p => p.pos },
    { key: "draft_pick", label: "Draft rank", num: true, get: p => p.draft_pick == null ? Infinity : p.draft_pick },
    { key: "owner", label: "Owner", num: false, get: ownerOf },
    { key: "total_points", label: "Total points", num: true, get: p => p.total_points },
    { key: "avg_points", label: "Avg points", num: true, get: p => p.avg_points },
  ];
  const sorter = makeSortHeader(COLS, "total_points", -1);

  const ownerSel = h("select", { "aria-label": "Filter by owner", onchange: () => render() },
    h("option", { value: "" }, "All owners"), h("option", { value: "free" }, "Free agent"),
    ranked.map(m => h("option", { value: m.entry_id }, nameOf(m))));
  const posSel = h("select", { "aria-label": "Filter by position", onchange: () => render() },
    h("option", { value: "" }, "All positions"), positions.map(p => h("option", { value: p }, p)));
  const clubSel = h("select", { "aria-label": "Filter by club", onchange: () => render() },
    h("option", { value: "" }, "All clubs"), clubs.map(c => h("option", { value: c }, c)));
  const nameInput = h("input", { type: "search", placeholder: "Player name", "aria-label": "Filter by player name", oninput: () => render() });
  const everyoneToggle = h("input", { type: "checkbox", onchange: () => { showEveryone = everyoneToggle.checked; render(); } });
  everyoneToggle.checked = true;

  const thead = h("thead", {});
  const body = h("tbody", {});
  const countNote = h("p", { class: "sub" });

  function row(p) {
    return h("tr", {},
      h("td", { class: "l" }, p.name), h("td", { class: "l" }, p.club), h("td", { class: "l" }, p.pos),
      h("td", { class: "num" }, p.draft_pick == null ? "–" : `Pick ${p.draft_pick}`),
      h("td", { class: "l" }, p.owner_entry_id == null ? h("span", { class: "tag-free" }, "Free agent") : ownerOf(p)),
      h("td", { class: "num" }, fmt(p.total_points)), h("td", { class: "num" }, p.avg_points.toFixed(1)));
  }
  function filtered() {
    const owner = ownerSel.value, pos = posSel.value, club = clubSel.value, name = nameInput.value.trim().toLowerCase();
    return AP.filter(p => {
      if (!showEveryone && !p.ever_owned) return false;
      if (owner === "free" && p.owner_entry_id != null) return false;
      if (owner && owner !== "free" && String(p.owner_entry_id) !== owner) return false;
      if (pos && p.pos !== pos) return false;
      if (club && p.club !== club) return false;
      if (name && !p.name.toLowerCase().includes(name)) return false;
      return true;
    });
  }
  function render() {
    const sorted = sorter.sorted(filtered());
    body.textContent = "";
    if (!sorted.length) body.append(h("tr", {}, h("td", { class: "l", colspan: COLS.length }, emptyMsg("No players match these filters."))));
    else body.append(...sorted.map(row));
    countNote.textContent = `${fmt(sorted.length)} of ${fmt(AP.length)} players shown.`;
    thead.textContent = ""; thead.append(sorter.row(render));
  }
  render();
  pg.append(section("All players"));
  pg.append(card("Every Premier League player", "Filter, search and sort by clicking a column. Shows every player by default; untick below to only see players who are or have been owned in this league this season.",
    h("div", { class: "filters" }, ownerSel, posSel, clubSel, nameInput),
    h("label", { style: "display:flex;align-items:center;gap:6px;margin:2px 0 12px;font-size:13px;color:var(--ink-2)" },
      everyoneToggle, "Show every player, including ones never owned this season"),
    countNote,
    h("div", { class: "tbl-wrap" }, h("table", {}, thead, body))));
}

/* feedback */
pg = panels.feedback;
pg.append(section("Feedback"));
{
  const text = h("textarea", { rows: "4", placeholder: "What would you like to see changed or added?" });
  const submit = h("button", { class: "ghost", type: "button", style: "margin-top:8px",
    onclick: () => { if (!text.value.trim()) { text.focus(); return; } openFeedbackIssue(text.value); text.value = ""; } },
    "Submit feedback");
  pg.append(card("Add feedback", "Opens a pre-filled GitHub issue with your text — the Feedback button above does the same for a quick note. You'll need a GitHub account to post it.",
    text, submit));
}
pg.append(h("p", { class: "sub" }, "Feedback already filed on this project, newest first:"));
{
  const box = h("div", {});
  pg.append(box);
  function loadIssues() {
    box.textContent = "";
    box.append(emptyMsg("Loading issues…"));
    fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=30&labels=feedback&sort=created&direction=desc`,
      { headers: { "Accept": "application/vnd.github+json" } })
      .then(res => {
        if (res.status === 403 || res.status === 429) throw new Error("rate-limited");
        if (!res.ok) throw new Error("http-" + res.status);
        return res.json();
      })
      .then(items => {
        const issues = (Array.isArray(items) ? items : []).filter(it => !it.pull_request);
        box.textContent = "";
        if (!issues.length) { box.append(emptyMsg("No feedback filed yet.")); return; }
        box.append(h("ul", { class: "plist" }, issues.map(it => {
          const link = typeof it.html_url === "string" && it.html_url.startsWith("https://github.com/") ? it.html_url : null;
          const when = new Date(it.created_at);
          const whenText = isNaN(when) ? "" : when.toLocaleDateString("en-GB", { dateStyle: "medium" });
          const author = (it.user && it.user.login) || "unknown";
          const replies = it.comments === 1 ? "1 reply" : `${fmt(it.comments)} replies`;
          const implemented = it.state !== "open";
          return h("li", {},
            h("span", {},
              link ? h("a", { href: link, target: "_blank", rel: "noopener noreferrer" }, it.title) : h("span", {}, it.title),
              h("span", { class: "meta" }, ` #${it.number} · ${author} · ${whenText}`)),
            h("span", { style: "display:flex;flex-direction:column;align-items:flex-end;gap:2px" },
              h("span", { class: implemented ? "up" : "down" }, implemented ? "Implemented" : "Open"),
              h("span", { class: "meta" }, replies)));
        })));
      })
      .catch(err => {
        box.textContent = "";
        const rateLimited = err.message === "rate-limited";
        box.append(emptyMsg(rateLimited
          ? "GitHub's API rate limit was hit. Wait a moment and try again."
          : "Could not load feedback right now."));
        box.append(h("button", { class: "ghost", type: "button", style: "margin-top:8px", onclick: loadIssues }, "Retry"));
      });
  }
  loadIssues();
}

/* footer + checks */
const chk = D.checks;
const foot = h("div", { class: "foot" },
  h("p", {}, "How the numbers work: a round score is the total of a manager's starting XI after automatic substitutions. Only finished gameweeks count. Ties for the top score count as a win for every tied manager. Transactions count accepted moves only."),
  h("p", {}, "Data comes from the public FPL Draft API, which is unofficial and can change without notice."));
const dl = h("details", {}, h("summary", {}, chk.all_ok ? "Data checks: all passed" : "Data checks: please review"));
const chkRows = chk.standings.map(c => h("tr", {}, h("td", { class: "l" }, nameOf(byId[c.entry_id])),
  h("td", { class: "num" }, fmt(c.site_total)), h("td", { class: "num" }, fmt(c.computed_through_current)),
  h("td", { class: "num" }, fmt(c.computed_through_finished)), h("td", {}, c.matches ? "Match" : "DIFFERENT")));
dl.append(h("div", { class: "tbl-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Team", "Site total", "Calculated incl. live GW", "Calculated finished GWs", "Result"].map((x, i) => h("th", { class: i ? "" : "l" }, x)))),
  h("tbody", {}, chkRows))));
if (chk.lineup_vs_official_mismatches.length) dl.append(h("p", { class: "sub" }, `${chk.lineup_vs_official_mismatches.length} lineup(s) where calculated and official round points differ.`));
if (chk.missing_lineups.length) dl.append(h("p", { class: "sub" }, `${chk.missing_lineups.length} lineup file(s) missing.`));
foot.append(dl);
app.append(foot);
document.title = meta.league_name + " · FPL Draft";
</script>
</body>
</html>
