<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Draft Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draft Dash">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --wash: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --good: #006300; --bad: #d03b3b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --h0: #cde2fb; --h1: #9ec5f4; --h2: #6da7ec; --h3: #2a78d6; --h4: #184f95;
  --h-ink-light: #0b0b0b; --h-ink-dark: #ffffff;
  --rs-lo: #e2a39d; --rs-hi: #9cc9a6;
  --fdr-1: #1f7a4d; --fdr-2: #3dd68c; --fdr-3: #d8d8d3; --fdr-4: #ef5c7a; --fdr-5: #8a1538;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --wash: #222221;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --good: #0ca30c; --bad: #ec6a6a;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --rs-lo: #96524c; --rs-hi: #4f8a5c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --wash: #222221;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --good: #0ca30c; --bad: #ec6a6a;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --rs-lo: #96524c; --rs-hi: #4f8a5c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 17px; margin: 40px 0 12px; font-weight: 650; }
h3 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0; }
button.ghost {
  background: transparent; color: var(--ink-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
button.ghost:hover { background: var(--wash); }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.banner { margin: 16px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--wash); font-size: 13px; color: var(--ink-2); }
.banner strong { color: var(--ink); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 20px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.tile { padding: 14px 16px; min-width: 0; }
.tile .label { color: var(--ink-2); font-size: 12.5px; margin: 0 0 6px; }
.tile .value { font-size: 26px; font-weight: 650; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.tile .value.small { font-size: 18px; }
.tile .note { color: var(--ink-2); font-size: 12.5px; margin: 6px 0 0; overflow-wrap: anywhere; }
.card { padding: 16px; margin-bottom: 12px; min-width: 0; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.chart { position: relative; margin-top: 8px; min-height: 120px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart:focus-visible { outline-offset: 4px; border-radius: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 140px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 8px 10px; font-size: 12.5px; color: var(--ink-2);
}
.tip .t { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.tip .r b { color: var(--ink); font-weight: 650; min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.tip .r span.nm { overflow-wrap: anywhere; }
.tbl-wrap {
  overflow-x: auto;
  --tbl-bg: var(--surface);
  background:
    linear-gradient(to right, var(--tbl-bg) 50%, transparent) left / 24px 100% no-repeat local,
    linear-gradient(to left, var(--tbl-bg) 50%, transparent) right / 24px 100% no-repeat local,
    linear-gradient(to right, rgba(0,0,0,.16), transparent) left / 10px 100% no-repeat scroll,
    linear-gradient(to left, rgba(0,0,0,.16), transparent) right / 10px 100% no-repeat scroll;
}
.foot .tbl-wrap { --tbl-bg: var(--page); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; font-size: 12.5px; }
th[role="button"] { cursor: pointer; user-select: none; }
th[role="button"]:hover { color: var(--ink); }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }
.who { display: inline-flex; align-items: center; gap: 8px; }
.who small { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
.rk { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.win { font-weight: 650; }
.mark { font-size: 10px; color: var(--ink-2); margin-right: 3px; }
tr.live td { color: var(--ink-2); font-style: italic; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
details .tbl-wrap { margin-top: 8px; }
.bars { display: grid; gap: 12px; margin-top: 10px; }
.brow { display: grid; grid-template-columns: minmax(84px, 150px) 1fr; gap: 12px; align-items: center; }
.brow .nm { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.brow .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btrack { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar { height: 20px; border-radius: 0 4px 4px 0; min-width: 2px; transition: filter .12s; }
.brow:hover .bar, .brow:focus-visible .bar { filter: brightness(1.12); }
.bval { font-weight: 650; font-variant-numeric: tabular-nums; }
.bnote { grid-column: 2; color: var(--ink-2); font-size: 12px; margin-top: -6px; }
.heat td, .heat th { padding: 4px; text-align: center; }
.heat td.l, .heat th.l { text-align: left; padding-left: 0; }
.heat .cell { min-width: 26px; height: 28px; line-height: 28px; border-radius: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.fdr .cell { min-width: 64px; height: auto; line-height: 1.3; padding: 5px 4px; font-weight: 650; }
.fdr .cell .gw { display: block; font-size: 10.5px; font-weight: 500; opacity: .75; }
.fdr .fav { margin-right: 2px; }
.plist { list-style: none; margin: 8px 0 0; padding: 0; }
.plist li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
.plist li:last-child { border-bottom: 0; }
.plist .meta { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
.pos { display: inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
.up { color: var(--good); font-weight: 650; }
.down { color: var(--bad); font-weight: 650; }
.tag-free, .tag-squad {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650;
  background: color-mix(in oklab, var(--good) 18%, var(--surface)); color: var(--good);
}
.teamtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
.teamtab {
  background: var(--wash); border: 1px solid var(--border); border-radius: 999px;
  color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600;
  padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.teamtab[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.teamtab:hover:not([aria-selected="true"]) { background: var(--surface); }
.pitch {
  position: relative;
  background: linear-gradient(180deg, #1f7a4d, #185f3d); border-radius: 14px;
  padding: 18px 8px; display: flex; flex-direction: column; gap: 10px; margin: 10px 0;
}
.pitch-box {
  position: absolute; top: 10px; background: rgba(0,0,0,.28); color: #fff;
  border-radius: 8px; padding: 4px 9px 5px; text-align: center; line-height: 1.1;
}
.pitch-box.l { left: 10px; }
.pitch-box.r { right: 10px; }
.pitch-box b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pitch-box span { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
/* A line can hold up to 5 (a back-5 or a midfield-5), so rows never wrap --
   chips shrink to fit instead, down to a readable floor; tap one for the rest. */
.pitch-row { display: flex; justify-content: center; align-items: flex-start; gap: 4px; flex-wrap: nowrap; }
.bench-wrap { margin-top: 4px; }
.bench-row { display: flex; justify-content: center; gap: 4px; flex-wrap: nowrap; margin-top: 8px; }
.player-chip {
  position: relative; background: rgba(255,255,255,.96); color: #0b0b0b; border-radius: 10px;
  padding: 7px 4px 6px; flex: 0 1 19%; min-width: 0; max-width: 92px; text-align: center; font-size: 11px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); border: 0; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.player-chip:hover, .player-chip:focus-visible { filter: brightness(1.04); }
.sg-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.sg { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.sg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.sg-pos { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--wash); color: var(--ink-2); }
.sg-gain { font-weight: 750; color: var(--good); font-variant-numeric: tabular-nums; }
.sg-gain-note { font-size: 12px; color: var(--muted); }
.sg-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.sg-row + .sg-row { border-top: 1px dashed var(--border); }
.sg-tag { flex: none; width: 36px; text-align: center; font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 2px 0; border: 1px solid currentColor; }
.sg-tag.in { color: var(--good); }
.sg-tag.out { color: var(--bad); }
.sg-who { flex: 1; min-width: 0; }
.sg-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-name { font-size: 14px; }
.sg-club { color: var(--ink-2); font-size: 12px; }
.sg-meta { color: var(--muted); font-size: 12px; }
.sg-meta .nw { white-space: nowrap; }
.sg-flag { margin-left: 6px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
.sg-flag.warn { background: var(--series-4); color: #0b0b0b; }
.sg-flag.bad { background: var(--bad); color: #fff; }
.sg-fx { flex: none; display: flex; gap: 2px; }
.sg-chip { width: 17px; height: 20px; line-height: 20px; text-align: center; border-radius: 4px; font-size: 10.5px; font-weight: 700; background: var(--wash); color: var(--ink-2); }
.sg-foot { margin-top: 12px; }
.player-chip:not(.played) { opacity: .5; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.player-chip .nm { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-chip .cl { color: #6b6a65; font-size: 10px; }
.player-chip .pt { font-size: 16px; font-weight: 800; margin: 3px 0 1px; }
.player-chip .st { color: #6b6a65; font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-chip .badge {
  position: absolute; top: -7px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
  font-size: 10px; font-weight: 800; line-height: 18px; color: #0b0b0b;
}
.player-chip .badge.c { background: #eda100; }
.player-chip .badge.vc { background: #d8d8d3; }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card {
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; max-width: 320px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.35);
}
.modal-card .pts { font-size: 30px; font-weight: 800; margin: 10px 0; display: flex; align-items: center; gap: 10px; }
.bonus-box {
  display: inline-block; min-width: 18px; height: 18px; line-height: 18px; padding: 0 4px; border-radius: 5px;
  font-size: 11px; font-weight: 800; color: #fff; text-align: center; font-variant-numeric: tabular-nums;
}
.bonus-box.b3 { background: #1f9d55; }
.bonus-box.b2 { background: #2a78d6; }
.bonus-box.b1 { background: #8b5cf6; }
.bonus-box.corner { position: absolute; top: -10px; left: -6px; min-width: 16px; height: 16px; line-height: 16px; font-size: 10.5px; box-shadow: 0 0 0 2px #fff; }
.bonus-box.lg { min-width: 26px; height: 26px; line-height: 26px; border-radius: 7px; font-size: 15px; }
.modal-card.wide { max-width: 600px; max-height: 88vh; overflow-y: auto; }
.mx-list { display: grid; }
.mx-day { font-size: 12px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; padding: 12px 2px 6px; }
.mx-day:first-child { padding-top: 0; }
.mx-row {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 8px; row-gap: 2px;
  width: 100%; padding: 10px 6px; background: none; border: 0; border-top: 1px solid var(--border);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer; border-radius: 0;
}
.mx-row:hover { background: var(--wash); }
.mx-status { grid-row: 1; font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.mx-status.live { color: var(--good); }
.mx-status.live { gap: 0; }
.mx-tick { animation: mx-blink 1s step-end infinite; }
@keyframes mx-blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .mx-tick { animation: none; } }
.mx-team { font-size: 14px; font-weight: 600; line-height: 1.2; }
.mx-team.h { text-align: right; }
@media (max-width: 380px) { .mx-team { font-size: 12.5px; } .mx-row { column-gap: 6px; } }
.mx-score { min-width: 50px; text-align: center; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 7px; background: var(--wash); }
.mx-row.live { background: color-mix(in oklab, var(--good) 12%, transparent); }
.mx-row.live:hover { background: color-mix(in oklab, var(--good) 18%, transparent); }
.mx-row.live .mx-team, .mx-row.live .mx-score { color: var(--good); }
.mx-row.live .mx-score { background: color-mix(in oklab, var(--good) 16%, transparent); }
.mx-row.upcoming .mx-score { color: var(--muted); font-weight: 600; }
.mx-scorers { grid-row: 2; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.mx-scorers.h { grid-column: 2; text-align: right; }
.mx-scorers.a { grid-column: 4; }
.mx-title { font-size: 18px; margin: 4px 0 6px; }
.mx-side { font-size: 13px; margin: 16px 0 6px; color: var(--ink-2); }
.mx-tbl { font-size: 13px; }
.mx-tbl th, .mx-tbl td { padding: 6px 4px; }
.mx-tbl th:first-child, .mx-tbl td:first-child { padding-left: 0; }
@media (max-width: 380px) { .modal-card.wide { padding: 14px 12px; } .mx-tbl { font-size: 12px; } .mx-tbl th, .mx-tbl td { padding: 6px 3px; } }
.mx-tbl td.num, .mx-tbl th:not(.l) { text-align: center; width: 1%; white-space: nowrap; }
.mx-who { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.mx-nm { font-weight: 600; }
.mx-pos { font-size: 10.5px; color: var(--muted); }
.mx-card { display: inline-block; width: 8px; height: 11px; border-radius: 2px; }
.mx-card.y { background: #f2c200; }
.mx-card.r { background: #d63c3c; }
.mx-og { font-size: 10px; font-weight: 700; color: var(--bad); }
.mx-legend { margin-top: 12px; font-size: 12px; }
.modal-stats { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; font-size: 13.5px; }
.modal-stats dt { color: var(--ink-2); }
.modal-stats dd { margin: 0; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.foot { margin-top: 40px; color: var(--ink-2); font-size: 12.5px; }
.foot p { margin: 4px 0; }
.empty { color: var(--ink-2); font-size: 13.5px; padding: 8px 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters select, .filters input {
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; min-width: 0;
}
textarea {
  display: block; width: 100%; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  font: inherit; font-size: 13.5px; resize: vertical;
}
.hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
[hidden] { display: none !important; }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 18px;
  position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--grid);
  overscroll-behavior-x: contain;
  background:
    linear-gradient(to right, var(--page) 50%, transparent) left / 24px 100% no-repeat local,
    linear-gradient(to left, var(--page) 50%, transparent) right / 24px 100% no-repeat local,
    linear-gradient(to right, rgba(0,0,0,.16), transparent) left / 10px 100% no-repeat scroll,
    linear-gradient(to left, rgba(0,0,0,.16), transparent) right / 10px 100% no-repeat scroll,
    var(--page);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  color: var(--ink-2); font: inherit; font-weight: 600; padding: 10px 14px; cursor: pointer; border-radius: 8px 8px 0 0;
}
.tab:hover { color: var(--ink); background: var(--wash); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.panel { min-width: 0; }
.panel:focus-visible { outline-offset: 6px; border-radius: 8px; }
.panel > h2:first-child { margin-top: 24px; }
a.tile { display: block; color: inherit; text-decoration: none; }
a.tile:hover { background: var(--wash); }
@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; }
  h1 { font-size: 21px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><div class="wrap">This dashboard needs JavaScript.</div></noscript>
<script src="data.js"></script>
<script>
"use strict";
const D = window.FPL_DATA;
const app = document.getElementById("app");

/* ---------- tiny DOM helpers (all text goes in via textContent) ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function mk(ns, tag, props, kids) {
  const el = ns ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

/* ---------- muted red-to-green score scale ---------- */
// A diverging scale (bad hue <-> neutral wash <-> good hue) rather than a
// four-hue traffic-light ramp: calmer, and it uses the app's own tones so it
// adapts with the theme instead of a fixed set of hex stops.
function roundColor(t) {

    return `color-mix(in oklab, var(--wash) ${local.toFixed(1)}%, var(--rs-lo) ${(100 - local).toFixed(1)}%)`;
  }
  const local = ((t - 0.5) / 0.5) * 100;

/* ---------- axis helpers ---------- */
function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, raw = span / count, pow = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(f => f * pow).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
  return { ticks: t, lo, hi };
}

/* ---------- line chart with crosshair + tooltip ---------- */

    const m = { l: 38, r: 14, t: 14, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = cfg.series.flatMap(s => s.values);
    let lo, hi, ticks;
    if (cfg.rank) { lo = 1; hi = cfg.rank; ticks = Array.from({ length: hi }, (_, i) => i + 1); }
    else { const nt = niceTicks(Math.min(...all), Math.max(...all), 5); lo = nt.lo; hi = nt.hi; ticks = nt.ticks; }
    const n = cfg.xs.length;
    const X = i => m.l + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
    const Y = v => cfg.rank ? m.t + ((v - lo) / (hi - lo || 1)) * ih : m.t + ih - ((v - lo) / (hi - lo || 1)) * ih;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.label });
    for (const t of ticks) {
      svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: t === lo && !cfg.rank ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));

    }
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 34))));
    cfg.xs.forEach((x, i) => {

    });
    for (const s of cfg.series) {
      const d = s.values.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
      svg.append(sv("path", { d, fill: "none", stroke: col(s.m), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }

    }

      svg.append(sv("text", { x: X(lab.i), y: Y(v) + (lab.below ? 17 : -9), "text-anchor": "middle", "font-size": 12, "font-weight": 650,
        fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 3, "paint-order": "stroke" }, fmt(v)));
    }
    const cross = sv("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, opacity: 0 });
    const hoverDots = cfg.series.map(s => sv("circle", { r: 4, fill: col(s.m), stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }));
    svg.append(cross, ...hoverDots);

    svg.append(overlay);

      cfg.series.forEach((s, k) => { hoverDots[k].setAttribute("cx", X(i)); hoverDots[k].setAttribute("cy", Y(s.values[i])); hoverDots[k].setAttribute("opacity", 1); });
      tip.textContent = "";
      tip.append(h("div", { class: "t" }, (cfg.xTitle || "Gameweek ") + cfg.xs[i]));
      const rows = cfg.series.map(s => ({ s, v: s.values[i] })).sort((a, b) => cfg.rank ? a.v - b.v : b.v - a.v);
      for (const r of rows) tip.append(tipRow(r.s.m, cfg.rank ? "#" + r.v : fmt(r.v)));

    };

      // The clock is a snapshot from the last update, so it counts on in the
      // browser -- capped at 45 until the next update confirms the second
      // half (never "52'" at half-time) and at 90 after that.
      const builtAt = Date.parse(meta.generated_at);
      function liveMinute(m, now = Date.now()) {
        if (m.minutes > 0) {
          const est = m.minutes + Math.max(0, Math.floor((now - builtAt) / 60000));
          const cap = m.minutes <= 45 ? 45 : 90;
          return est > cap ? `${cap}+` : String(est);
        }
        // No clock in the feed: estimate from kick-off, allowing ~16 minutes of half-time.
        const el = Math.floor((now - Date.parse(m.kickoff)) / 60000);
        if (!(el >= 0)) return "1";
        if (el < 45) return String(el + 1);
        if (el <= 47) return "45+";
        if (el < 62) return "HT";
        return el - 16 >= 90 ? "90+" : String(el - 16);

      const liveClocks = [];
      const clockEl = m => {
        const min = h("span", { class: "mx-min" }), tick = h("span", { class: "mx-tick" }, "'");

        paint(); liveClocks.push(paint);
        return [min, tick];
      };
      setInterval(() => liveClocks.forEach(p => p()), 20000);

      const sideTable = s => s.players.length ? h("div", { class: "tbl-wrap" }, h("table", { class: "mx-tbl" },

          h("td", { class: "l" }, h("span", { class: "mx-who" }, ownerDot(p), h("span", { class: "mx-nm" }, p.name),

      function openMatch(m) {

{

      const vals = [];

        if (!included[i]) continue;

if (chk.missing_lineups.length) dl.append(h("p", { class: "sub" }, `${chk.missing_lineups.length} lineup file(s) missing.`));
foot.append(dl);
app.append(foot);
document.title = meta.league_name + " · FPL Draft";
</script>
